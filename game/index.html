<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>STARFORGE — gravity is your weapon</title>
<meta name="description" content="STARFORGE: a neon gravity-arena survival game. Catch asteroids in your orbit — your orbit is shield and ammo — chain nova kills, draft upgrades, and break the Devourer at wave 10.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Ccircle cx='8' cy='8' r='3' fill='%236ff7ff'/%3E%3Ccircle cx='8' cy='8' r='6.5' fill='none' stroke='%23ffc857' stroke-width='1.4'/%3E%3C/svg%3E">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #04060f;
    height: 100%;
    overflow: hidden;
  }
  body {
    display: grid;
    place-items: center;
    background: radial-gradient(1200px 700px at 50% 42%, #0a1230 0%, #04060f 70%);
  }
  canvas#game {
    display: block;
    width: min(100vw, calc(100vh * 16 / 9));
    height: auto;
    aspect-ratio: 16 / 9;
    background: #04060f;
    box-shadow: 0 0 90px rgba(64, 160, 255, 0.22), 0 0 22px rgba(111, 247, 255, 0.12);
    cursor: crosshair;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720"></canvas>
<script type="module" src="src/main.js"></script>
</body>
</html>
